      "agents": [],
      "tools": [
        "build-dashboard",
        "validate-dashboard-structure",
        "validate-dashboard-visual",
        "validate-html"
      ],
      "templates": [
        "dashboard-data-example",
        "dashboard-structure",
        "dashboard-shell"
      ]
    },
    "recommended": {"skills": [], "agents": [], "tools": [], "templates": []},
    "optional": {"skills": [], "agents": [], "tools": [], "templates": []}
  },
  "conditions": [],
  "outputs": ["canonical dashboard data", "canonical section profile", "generated read-only HTML", "structural drift and visual validation evidence"],
