<!doctype html>
<html lang="en" __BRAND_ATTRIBUTES__>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  __BRAND_FAVICON__
  <title>Traced service interface evidence</title>
  <style>
    :root {
      --brand-primary:#174a5b; --brand-accent:#e0643a; --canvas:#f4f6f5; --surface:#fff;
      --ink:#122126; --muted:#52666c; --rule:#bdc9cc; --strong-rule:#82979c;
      --display:"Arial Narrow","Aptos Narrow","Helvetica Neue",Arial,sans-serif;
      --body:"Aptos","Helvetica Neue",Arial,sans-serif; --data:"SFMono-Regular",Consolas,monospace;
      --content:min(1240px,calc(100% - 64px)); --measure:62ch;
      --section-space:clamp(72px,10vw,144px); --component-space:clamp(20px,3vw,42px);
      --radius:2px; --transition:160ms ease;
    }
    /* BRAND_PROFILE_START */__BRAND_STYLE__/* BRAND_PROFILE_END */
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--canvas); color:var(--ink); font:17px/1.58 var(--body); text-rendering:optimizeLegibility; }
    nav,section,footer { width:var(--content); margin:auto; }
    nav { display:flex; justify-content:space-between; align-items:center; min-height:68px; border-bottom:1px solid var(--rule); }
    .artifact-brand-logo { display:block; width:auto; max-width:min(300px,48vw); height:42px; object-fit:contain; object-position:left center; }
    nav a { color:var(--link,var(--brand-primary)); text-underline-offset:.2em; }
    main { overflow:hidden; }
    section { min-height:100svh; display:grid; align-content:center; padding:var(--section-space) 0; }
    .stage { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(250px,.65fr); gap:clamp(40px,8vw,120px); align-items:end; }
    .eyebrow { margin:0; font:700 .68rem/1.2 var(--data); letter-spacing:.1em; text-transform:uppercase; color:var(--brand-primary); }
    h1 { max-width:16ch; margin:.28em 0; font:700 clamp(3.4rem,8vw,7.4rem)/.92 var(--display); letter-spacing:-.055em; text-wrap:balance; }
    .lede { max-width:var(--measure); font-size:clamp(1.05rem,1.5vw,1.35rem); color:var(--muted); }
    .signature { position:relative; width:min(360px,70vw); height:4px; margin:38px 0; background:var(--brand-primary); }
    .signature::after { content:""; position:absolute; right:0; width:28%; height:100%; background:var(--brand-accent); }
    .proof { padding:24px 0; border-block:1px solid var(--strong-rule); }
    .proof small { display:block; margin-bottom:18px; color:var(--muted); font:700 .64rem/1.3 var(--data); letter-spacing:.08em; text-transform:uppercase; }
    .proof strong { display:block; font:700 clamp(1.4rem,2.8vw,2.4rem)/1 var(--display); letter-spacing:-.035em; }
    .proof p { max-width:34ch; margin:16px 0 0; color:var(--muted); }
    footer { display:flex; justify-content:space-between; align-items:center; padding:24px 0; border-top:1px solid var(--rule); }
    footer button { padding:.55rem .8rem; border:1px solid var(--strong-rule); background:var(--surface); color:var(--ink); font:inherit; }
    a:focus-visible,button:focus-visible { outline:3px solid var(--brand-accent); outline-offset:4px; }
    @media (max-width:760px) { :root { --content:calc(100% - 32px); } .stage { grid-template-columns:1fr; gap:40px; } section { min-height:auto; padding:72px 0; } }
    @media (prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } *,*::before,*::after { animation:none!important; transition:none!important; } }
    @media print { nav { display:none; } section { min-height:auto; break-after:page; } }
  </style>
</head>
<body>
  <header data-brand-validation-role="header"><nav aria-label="Artifact navigation" data-brand-validation-role="navigation">__BRAND_LOGO__<a href="#opening">Evidence</a></nav></header>
  <main>
    <section id="opening" aria-labelledby="opening-title">
      <div class="stage"><div><p class="eyebrow">Validated service evidence</p><h1 id="opening-title">Two traced interfaces</h1><div class="signature" aria-hidden="true"></div><p class="lede">The sample service has two traced interfaces.</p></div><aside class="proof"><small>Evidence identifier</small><strong>E-SYN-002</strong><p>The claim and its evidence identifier are presented together.</p></aside></div>
    </section>
  </main>
  <footer data-brand-validation-role="footer"><span>Offline branded artifact</span><button type="button">Print</button></footer>
  <script id="brand-profile" type="application/json">__BRAND_PROFILE_JSON__</script>
</body>
</html>
