<!doctype html>
<html lang="de-AT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23006b55'/%3E%3C/svg%3E">
  <title>Bilingual localization fixture</title>
  <style>
    :root { --ink:#172126; --paper:#f5f7f7; --line:#aebdc1; --accent:#006b55; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui,sans-serif; }
    header,main { width:min(920px,calc(100% - 32px)); margin:auto; }
    header { display:flex; justify-content:space-between; align-items:center; gap:20px; padding:28px 0; border-bottom:1px solid var(--line); }
    h1 { max-width:22ch; margin:0; overflow-wrap:anywhere; font-size:clamp(1.8rem,5vw,3.6rem); line-height:1; }
    .language-switch { display:flex; min-width:0; max-width:100%; gap:4px; padding:4px; border:1px solid var(--line); border-radius:999px; }
    .language-switch button { min-width:0; border:0; border-radius:999px; padding:8px 12px; background:transparent; color:inherit; cursor:pointer; }
    .language-switch button.active { background:var(--ink); color:white; }
    .language-switch button:focus-visible, select:focus-visible, summary:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    .panel { min-width:0; margin:24px 0; padding:24px; border:1px solid var(--line); background:white; }
    .panel p { overflow-wrap:anywhere; }
    label { display:grid; min-width:0; max-width:34rem; gap:6px; overflow-wrap:anywhere; font-weight:650; }
    select { width:100%; min-width:0; max-width:100%; padding:10px; font:inherit; }
    details { min-width:0; max-width:100%; margin-top:20px; }
    summary { overflow-wrap:anywhere; cursor:pointer; font-weight:700; }
    @media (max-width:620px) { header { align-items:flex-start; flex-direction:column; } .language-switch { align-self:stretch; } .language-switch button { flex:1; } .panel { padding:18px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
    @media print { .language-switch { display:none; } body { background:white; } }
  </style>
</head>
<body>
  <header>
    <h1 data-i18n="title">Modernization delivery overview</h1>
    <div class="language-switch" role="radiogroup" aria-label="Language" data-i18n-attr="aria-label:switch.label">
      <button type="button" role="radio" data-localization-locale="de-AT" aria-label="Deutsch (Österreich)" aria-checked="true"><span aria-hidden="true">🇦🇹</span></button>
      <button type="button" role="radio" data-localization-locale="en" aria-label="English" aria-checked="false"><span aria-hidden="true">🇬🇧</span></button>
    </div>
  </header>
  <main>
    <section class="panel">
      <label><span data-i18n="filter.label">Decision-readiness filter</span>
        <select id="readiness-filter">
          <option value="all" data-i18n="filter.all">All states</option>
          <option value="ready" data-i18n="filter.ready">Ready for decision</option>
          <option value="blocked" data-i18n="filter.blocked">Blocked by unresolved evidence</option>
        </select>
      </label>
      <details id="evidence-details">
        <summary data-i18n="details.summary">Show evidence and delivery assumptions</summary>
        <p data-i18n="details.body">OrderService calls PaymentGateway through /payments/authorize. The evidence remains linked to src/main/java/example/OrderService.java:123.</p>
      </details>
    </section>
  </main>
  <script>
    window.__CLIENT_LOCALIZATION__ = {
      source_locale: "en",
      target_locales: ["de-AT"],
      default_locale: "de-AT",
      fallback_locale: "en",
      storage_key: "agent-commons-localization-browser-fixture",
      messages: {
        "title": {source:"Modernization delivery overview",translations:{"de-AT":"Übersicht zur Modernisierungslieferung"}},
        "switch.label": {source:"Language",translations:{"de-AT":"Sprache"}},
        "filter.label": {source:"Decision-readiness filter",translations:{"de-AT":"Filter für die Entscheidungsreife"}},
        "filter.all": {source:"All states",translations:{"de-AT":"Alle Statuswerte"}},
        "filter.ready": {source:"Ready for decision",translations:{"de-AT":"Entscheidungsreif"}},
        "filter.blocked": {source:"Blocked by unresolved evidence",translations:{"de-AT":"Durch offene Evidenz blockiert"}},
        "details.summary": {source:"Show evidence and delivery assumptions",translations:{"de-AT":"Evidenz und Annahmen zur Lieferung anzeigen"}},
        "details.body": {source:"OrderService calls PaymentGateway through /payments/authorize. The evidence remains linked to src/main/java/example/OrderService.java:123.",translations:{"de-AT":"Der OrderService ruft PaymentGateway über /payments/authorize auf. Die Evidenz bleibt mit src/main/java/example/OrderService.java:123 verknüpft."}}
      }
    };
  </script>
  <script src="../../../skills/localize-client-artifact/assets/bilingual-runtime.js"></script>
</body>
</html>
