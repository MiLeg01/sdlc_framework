    expected: ["project governance", "manifest and canonical state", "relevant project memory", "stable ID or safe path resolution", "lifecycle stage", "blockers", "canonical capability and subject", "explicit runtime invocation", "dashboard synchronization"]
    invariants: ["orchestration only", "manifest does not execute automatically", "no unanchored coding", "OpenSpec before required implementation", "TDD remains canonical", "batch mode explicit", "unsafe parallelism rejected"]
    failures: ["dashboard treated as editable truth", "arbitrary specification selected", "requirement without specification implemented", "path escape accepted", "entire backlog started by default"]
    scenarios:
      initialized_analysis_project:
        fixture: "A legacy source is configured but analysis has not started."
        expected: ["analyze-legacy-system", "exact next action"]
      requirements_missing:
        fixture: "Legacy analysis is complete but required requirements are missing."
        expected: ["derive-modernization-requirements"]
      specifications_missing:
        fixture: "Approved requirements exist and migration preparation requires OpenSpec, but specifications are missing."
        expected: ["specify-openspec-change", "no implementation"]
      explicit_specification:
        fixture: "SPEC-007 is ready and the user invokes continue-project SPEC-007."
        expected: ["implement-openspec-change SPEC-007", "test-driven-development handoff"]
      validation_pending:
        fixture: "Implementation is complete but OpenSpec verification is incomplete."
        expected: ["verify-openspec-implementation"]
      everything_current:
        fixture: "Every in-scope specification is implemented and validated."
        expected: ["no required action", "optional actions only"]
      explicit_batch:
        fixture: "The user explicitly requests all ready specifications."
        expected: ["dependency ordering", "safe concurrency analysis", "bounded slices", "validation", "dashboard refresh"]
  deconstruct-problem-first-principles:
    positive: "Before we plan this, work out what the actual problem is — the obvious fix feels like it is treating a symptom."
    negative: "You have already worked out the cause; now write the implementation plan and sequence the tasks."
    ambiguous: "This bug keeps coming back" # verify the stated claims against current evidence, then name the violated invariant before proposing anything
