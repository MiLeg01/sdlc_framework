version: 1
skills:
  initialize-project:
    positive: "Start research followed by a client-branded sales presentation using supplied timeline and deck references; infer public-sector locale and output policy when evidence supports it."
    negative: "Translate this sentence."
    ambiguous: "Help me start a project" # inspect first, then ask adaptive scope/goal questions
    expected: ["natural-language composition", "research and presentation settings", "structured project references", "canonical dashboard structure without a layout question", "separate client dashboard and presentation policies", "semantic capability comparison", "AGENTS.md project governance", ".agent-commons.yaml capability references", "stable canonical skill IDs", "bounded next action"]
    invariants: ["no overwrite", "no automatic capability execution", "no re-asking supplied topic audience sector or locale", "explicit output override wins", "references project-local", "no external search before user choice", "Git only when absent and desired"]
    failures: ["large questionnaire", "asking discoverable facts", "combination archetype proliferation", "client reference promoted globally", "discovery treated as installation"]
  continue-project:
