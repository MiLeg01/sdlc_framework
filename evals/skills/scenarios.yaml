    failures: ["conclusion formed at step one and justified afterwards", "stated solution accepted as the requirement", "root cause asserted from the problem statement without grounding", "second site found but left unreported", "structural change recommended by default", "symptom patched with the choice left implicit", "deconstruction continued into a plan or a fix"]
    scenarios:
      solution_disguised_as_requirement:
        fixture: "The request names a specific mechanism to add rather than the outcome it needs."
        expected: ["framing marked as inherited", "underlying requirement recovered", "mechanism not adopted as a constraint"]
      surface_is_not_origin:
        fixture: "A failing test points at one component while the violated invariant lives in another."
        expected: ["trace not treated as complete truth", "invariant named where it actually breaks"]
      inversion_finds_second_site:
        fixture: "The same assumption is relied on by another code path outside the reported scope."
        expected: ["second site reported", "reported even though out of scope"]
      local_patch_is_correct:
        fixture: "The cheapest correct fix is at the symptom and a structural change would be disproportionate."
        expected: ["symptom level chosen", "reason recorded", "not treated as a failure of the analysis"]
      cannot_be_restated:
        fixture: "The problem cannot be expressed in plain language without the existing implementation's vocabulary."
        expected: ["reported as a finding", "not written around"]
      constraint_is_a_product_decision:
        fixture: "The real constraint turns out to be an unresolved business decision rather than a technical one."
        expected: ["stopped and returned", "decision named", "no technical approach invented to cover it"]
